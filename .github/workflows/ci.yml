name: CI android-telegram-monitor

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Bash (shellcheck)
        run: shellcheck monitor.sh verify_env.sh tests/test_monitor.sh

      - name: Ejecutar tests unitarios
        run: bash tests/test_monitor.sh

      - name: Secret Detection (no secrets en .env ni código)
        run: |
          if grep -qiE 'password|token|secret|api_key' monitor.sh verify_env.sh tests/test_monitor.sh README.md; then
            echo "Advertencia: se hallaron posibles referencias a secretos en archivos versionados."
          fi
          test ! -f .env || { echo "ERROR: .env no debe estar versionado"; exit 1; }
